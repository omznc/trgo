<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>trgo extension</title>
		<style>
			:root { color-scheme: light dark; font-family: system-ui, sans-serif; }
			body { max-width: 34rem; margin: 3rem auto; padding: 0 1.25rem; line-height: 1.5; }
			h1 { font-size: 1.5rem; }
			button { font: inherit; padding: 0.6rem 1.2rem; border-radius: 0.6rem; border: 0; background: #2563eb; color: #fff; cursor: pointer; }
			button[hidden] { display: none; }
			#status { font-weight: 600; }
		</style>
	</head>
	<body>
		<h1>trgo extension</h1>
		<p>This extension lets the trgo page read marketplace pages directly in your browser. It does not collect or send any data to the trgo developer.</p>
		<p>It can read these sites:</p>
		<ul id="sites"></ul>
		<p>Your browser may not allow this access at install. Click the button to allow it.</p>
		<p><button id="allow" type="button">Allow access</button> <span id="status" role="status"></span></p>
		<script src="welcome.js"></script>
	</body>
</html>
