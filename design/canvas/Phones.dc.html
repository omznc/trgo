.dock{animation:dock .7s cubic-bezier(.2,.9,.3,1) both}
.attn{animation:attn 2.6s ease-in-out .8s infinite}

.dot1,.dot2,.dot3{animation:blink 1.2s ease-in-out infinite}
.dot2{animation-delay:.15s}.dot3{animation-delay:.3s}
.caret{animation:caret 1s steps(1) infinite}
.conf{animation:fall 2.8s linear infinite}
.fly{animation:flyIn .45s cubic-bezier(.2,.9,.3,1) both}

@keyframes dock{from{opacity:.6;transform:translateY(-40vh)}to{opacity:1;transform:none}}

@keyframes shim{to{background-position:-200% 0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes caret{50%{opacity:0}}
@keyframes fall{from{transform:translateY(-30px)}to{transform:translateY(520px)}}
@keyframes flyIn{from{opacity:0;transform:translateX(48px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion: reduce){.in,.dock,.fly{animation:fade .3s ease both}.attn,.shim,.spin,.conf,.caret,.dot1,.dot2,.dot3{animation:none}}
